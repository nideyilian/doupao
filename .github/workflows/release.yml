name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # node:sqlite 需要 Node 22.5+；Node 22 上 vitest fork worker 偶发崩溃
          # （Worker exited unexpectedly，本地 Node 26 无此现象），改用 24 LTS 对齐。
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck electron
        run: npx tsc -p electron/tsconfig.json --noEmit

      - name: Build frontend
        run: npm run build

      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: false
          EP_PRE_RELEASE: false
        run: npx electron-builder --publish always --win
